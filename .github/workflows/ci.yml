name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KIT_SHA: 6c0a85aab458a0750ff7adfc70d1d173bab60ae6   # pinned Secret-Wards-ToolKit commit

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: medveil
      - name: Fetch the organizers' team kit (practice data and checkers)
        run: |
          git clone https://github.com/Reinforce-SST/Secret-Wards-ToolKit.git Secret-Wards-ToolKit
          git -C Secret-Wards-ToolKit checkout --quiet "$KIT_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: medveil
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit and end-to-end tests
        working-directory: medveil
        run: python -m pytest -q
      - name: Quality gate on the practice data
        working-directory: medveil
        run: python tools/ci_gate.py --input ../Secret-Wards-ToolKit/dev/input --truth ../Secret-Wards-ToolKit/dev/truth/truth.json
      - name: Quality gate on held-out chaos variants
        working-directory: medveil
        run: |
          python tools/chaos_gen.py --kit ../Secret-Wards-ToolKit --out chaos --seed 7
          python tools/ci_gate.py --input chaos/7/input --truth chaos/7/truth/truth.json
          python tools/chaos_gen.py --kit ../Secret-Wards-ToolKit --out chaos --seed 11 --variants names,headers,ids
          python tools/ci_gate.py --input chaos/11/input --truth chaos/11/truth/truth.json
      - name: Quality gate on twenty more chaos seeds (21-40)
        # Seeds 7 and 11 were used while developing, so they no longer measure generalization
        # on their own; seeds 21-40 exposed header and label gaps they had hidden.
        working-directory: medveil
        run: |
          for s in $(seq 21 40); do
            python tools/chaos_gen.py --kit ../Secret-Wards-ToolKit --out chaos --seed "$s" > /dev/null
            python tools/ci_gate.py --input "chaos/$s/input" --truth "chaos/$s/truth/truth.json"
            rm -rf "chaos/$s"
          done
      - name: Adversarial set (tweaked PII, encoded payloads, hostile files) must not leak
        working-directory: medveil
        run: |
          python tools/adversarial_gen.py --kit ../Secret-Wards-ToolKit --out adv --seed 3
          RAKSHA_SECRET=ci python main.py --input adv/3/input --output out_adv
          python tools/adversarial_gen.py --verify out_adv --truth adv/3/truth/truth.json --input adv/3/input
      - name: Organizers' pre-submit check (3 runs)
        working-directory: medveil
        run: python ../Secret-Wards-ToolKit/check_submission.py --repo . --run

  runtime-only-install:
    # The evaluator installs requirements.txt only: make sure the pipeline runs with nothing else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: medveil
      - run: |
          git clone https://github.com/Reinforce-SST/Secret-Wards-ToolKit.git Secret-Wards-ToolKit
          git -C Secret-Wards-ToolKit checkout --quiet "$KIT_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run with runtime requirements only (the pipeline blocks its own sockets)
        working-directory: medveil
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          RAKSHA_SECRET=ci .venv/bin/python main.py --input ../Secret-Wards-ToolKit/dev/input --output /tmp/out
          .venv/bin/python ../Secret-Wards-ToolKit/validate_output.py --input ../Secret-Wards-ToolKit/dev/input --output /tmp/out
          cat /tmp/out/report.json | python -c "import json,sys; r=json.load(sys.stdin); print(r['counts'], r['timing'], r['resources'])"
