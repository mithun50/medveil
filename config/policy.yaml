# MedVeil privacy policy. Values were chosen with the red-team harness on the practice
# registry (python tools/sweep.py); the measured trade-off is in README.md.

pseudonym:
  length: 8                # PSN- plus 8 letters from HMAC-SHA256(K_psn, canonical cluster key)

dates:
  shift_min_days: 30       # every date of one patient moves by one keyed offset
  shift_max_days: 365      # in plus or minus [30, 365] days, never 0

dob:
  mode: suppress           # a truthful DOB reveals the birth year and undoes age banding

age:
  ladder: [10, 20]         # aligned band widths tried in order
  top_code: 80             # ages 80 and above become "80+"
  k_patients: 2            # keep 10-year bands only if 2+ patients share (gender, band, district)

location:
  keep_level: district     # district is kept for research; house, mohalla, landmark, village, tehsil removed
  fallback_level: state    # if fewer than k_patients share (gender, band, district), publish only the state
  k_patients: 3            # measured (tools/sweep.py): risk 0.133 at k=2, 0.109 at k=3, utility 97.5% -> 96.8%
  pin_prefix_digits: 3     # PIN fields keep the first 3 digits: 229***

rare_values:
  enabled: true            # generalize diagnoses/procedures that 2 or fewer patients share
  max_profiles_rare: 2

ingest:
  max_file_mb: 200
  max_json_depth: 200
  on_garbled_text: quarantine

quarantine:
  vault: encrypted         # AES-256-GCM blobs in output/quarantine (not part of the release)
